# Cucumber configuration
cucumber.glue=com.gizemcakmak.automation
cucumber.plugin=pretty,summary,io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# Parallel execution
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.execution-mode.feature=concurrent